backend:
  name: git-gateway
  branch: main

media_folder: "admin/uploads"
public_folder: "/admin/uploads"

publish_mode: simple

collections:
  - name: "reviews"
    label: "Posts"
    files:
      - name: "reviews"
        label: "All posts (On Spec / On Trail / On Air)"
        file: "content/reviews.json"
        fields:
          - label: "Posts"
            name: "items"
            widget: "list"
            types:
              - label: "On Spec — gear review"
                name: "gear"
                widget: "object"
                summary: "{{fields.title}}"
                fields:
                  - {label: "ID (unique, no spaces)", name: "id", widget: "string"}
                  - {label: "Type", name: "type", widget: "hidden", default: "gear"}
                  - label: "Category"
                    name: "cat"
                    widget: "select"
                    options: ["Tent", "Backpack", "Sleeping Bag", "Apparel", "Other Gear"]
                  - {label: "Mini tag (e.g. weight shown on card)", name: "miniTag", widget: "string", required: false}
                  - {label: "Icon (single emoji)", name: "icon", widget: "string"}
                  - {label: "Sponsored post", name: "sponsored", widget: "boolean", default: false}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "One-line angle (shown on card)", name: "angle", widget: "text"}
                  - {label: "Author", name: "author", widget: "string"}
                  - {label: "Date (e.g. Aug 9, 2026)", name: "date", widget: "string"}
                  - label: "Spec rows"
                    name: "specRows"
                    widget: "list"
                    fields:
                      - {label: "Label", name: "label", widget: "string"}
                      - {label: "Value", name: "value", widget: "string"}
                  - {label: "Developer verdict", name: "verdict", widget: "text"}
                  - label: "Body sections"
                    name: "body"
                    widget: "list"
                    fields:
                      - {label: "Heading", name: "h", widget: "string"}
                      - {label: "Paragraph", name: "p", widget: "text"}
                      - {label: "Pull quote (optional)", name: "pull", widget: "text", required: false}

              - label: "On Trail — trail report"
                name: "trail"
                widget: "object"
                summary: "{{fields.title}}"
                fields:
                  - {label: "ID (unique, no spaces)", name: "id", widget: "string"}
                  - {label: "Type", name: "type", widget: "hidden", default: "trail"}
                  - {label: "Region (e.g. Washington)", name: "cat", widget: "string"}
                  - {label: "Mini tag (e.g. distance shown on card)", name: "miniTag", widget: "string", required: false}
                  - {label: "Icon (single emoji)", name: "icon", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "One-line angle (shown on card)", name: "angle", widget: "text"}
                  - {label: "Author", name: "author", widget: "string"}
                  - {label: "Date (e.g. Aug 9, 2026)", name: "date", widget: "string"}
                  - label: "Trail spec rows"
                    name: "specRows"
                    widget: "list"
                    fields:
                      - {label: "Label", name: "label", widget: "string"}
                      - {label: "Value", name: "value", widget: "string"}
                  - {label: "Field notes (verdict)", name: "verdict", widget: "text"}
                  - label: "Body sections"
                    name: "body"
                    widget: "list"
                    fields:
                      - {label: "Heading", name: "h", widget: "string"}
                      - {label: "Paragraph", name: "p", widget: "text"}
                      - {label: "Pull quote (optional)", name: "pull", widget: "text", required: false}

              - label: "On Air — news"
                name: "air"
                widget: "object"
                summary: "{{fields.title}}"
                fields:
                  - {label: "ID (unique, no spaces)", name: "id", widget: "string"}
                  - {label: "Type", name: "type", widget: "hidden", default: "air"}
                  - {label: "Topic (e.g. Materials)", name: "cat", widget: "string"}
                  - {label: "Icon (single emoji)", name: "icon", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "One-line angle (shown on card)", name: "angle", widget: "text"}
                  - {label: "Author", name: "author", widget: "string", default: "Editorial"}
                  - {label: "Date (e.g. Aug 9, 2026)", name: "date", widget: "string"}
                  - label: "At a glance rows"
                    name: "specRows"
                    widget: "list"
                    fields:
                      - {label: "Label", name: "label", widget: "string"}
                      - {label: "Value", name: "value", widget: "string"}
                  - {label: "Why it matters (verdict)", name: "verdict", widget: "text"}
                  - label: "Body sections"
                    name: "body"
                    widget: "list"
                    fields:
                      - {label: "Heading", name: "h", widget: "string"}
                      - {label: "Paragraph", name: "p", widget: "text"}
                      - {label: "Pull quote (optional)", name: "pull", widget: "text", required: false}
