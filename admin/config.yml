backend:
  name: git-gateway
  branch: main

media_folder: "admin/uploads"
public_folder: "/admin/uploads"

publish_mode: simple

collections:
  - name: "reviews"
    label: "Posts"
    files:
      - name: "reviews"
        label: "All posts (On Spec / On Trail / On Air)"
        file: "content/reviews.json"
        fields:
          - label: "Posts"
            name: "items"
            widget: "list"
            types:
              - label: "On Spec — gear review"
                name: "gear"
                widget: "object"
                summary: "{{fields.title}}"
                fields:
                  - {label: "ID (short, unique, no spaces — e.g. g7)", name: "id", widget: "string"}
                  - {label: "Type", name: "type", widget: "hidden", default: "gear"}
                  - label: "Category"
                    name: "cat"
                    widget: "select"
                    options: ["Tent", "Backpack", "Sleeping Bag", "Apparel", "Other Gear"]
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Preview line (shown on the card)", name: "angle", widget: "text"}
                  - {label: "Icon (single emoji)", name: "icon", widget: "string", default: "📦"}
                  - {label: "Mini tag (e.g. weight, shown on card)", name: "miniTag", widget: "string", required: false}
                  - {label: "Sponsored post", name: "sponsored", widget: "boolean", default: false}
                  - {label: "Author", name: "author", widget: "string"}
                  - {label: "Date (e.g. Aug 9, 2026)", name: "date", widget: "string"}
                  - label: "Key specs"
                    name: "specText"
                    widget: "text"
                    hint: "One per line, like: Weight: 1,180 g"
                  - {label: "Developer verdict (one short paragraph)", name: "verdict", widget: "text"}
                  - label: "Body"
                    name: "body"
                    widget: "markdown"
                    hint: "Write freely. Use ## for a subheading, and > for a highlighted pull quote."
                    buttons: ["bold", "italic", "link"]
                    editor_components: []

              - label: "On Trail — trail report"
                name: "trail"
                widget: "object"
                summary: "{{fields.title}}"
                fields:
                  - {label: "ID (short, unique, no spaces — e.g. t4)", name: "id", widget: "string"}
                  - {label: "Type", name: "type", widget: "hidden", default: "trail"}
                  - {label: "Region (e.g. Washington)", name: "cat", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Preview line (shown on the card)", name: "angle", widget: "text"}
                  - {label: "Icon (single emoji)", name: "icon", widget: "string", default: "🥾"}
                  - {label: "Mini tag (e.g. distance, shown on card)", name: "miniTag", widget: "string", required: false}
                  - {label: "Author", name: "author", widget: "string"}
                  - {label: "Date (e.g. Aug 9, 2026)", name: "date", widget: "string"}
                  - label: "Trail specs"
                    name: "specText"
                    widget: "text"
                    hint: "One per line, like: Distance: 18.5 mi"
                  - {label: "Field notes (one short paragraph)", name: "verdict", widget: "text"}
                  - label: "Body"
                    name: "body"
                    widget: "markdown"
                    hint: "Write freely. Use ## for a subheading, and > for a highlighted pull quote."
                    buttons: ["bold", "italic", "link"]
                    editor_components: []

              - label: "On Air — news"
                name: "air"
                widget: "object"
                summary: "{{fields.title}}"
                fields:
                  - {label: "ID (short, unique, no spaces — e.g. a4)", name: "id", widget: "string"}
                  - {label: "Type", name: "type", widget: "hidden", default: "air"}
                  - {label: "Topic (e.g. Materials)", name: "cat", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Preview line (shown on the card)", name: "angle", widget: "text"}
                  - {label: "Icon (single emoji)", name: "icon", widget: "string", default: "📰"}
                  - {label: "Author", name: "author", widget: "string", default: "Editorial"}
                  - {label: "Date (e.g. Aug 9, 2026)", name: "date", widget: "string"}
                  - label: "At a glance"
                    name: "specText"
                    widget: "text"
                    hint: "One per line, like: Topic: Materials"
                  - {label: "Why it matters (one short paragraph)", name: "verdict", widget: "text"}
                  - label: "Body"
                    name: "body"
                    widget: "markdown"
                    hint: "Write freely. Use ## for a subheading, and > for a highlighted pull quote."
                    buttons: ["bold", "italic", "link"]
                    editor_components: []
